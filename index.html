<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Griff-Tech Login</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <img src="Griffin logo.png" alt="Griff-Tech Logo" class="header-logo" />
    <h1 class="header-title">Griff-Tech!</h1>
  </header>

  <!-- LOGIN SECTION -->
  <section class="login-section">

    <div class="login-card">

      <img src="Griffin card.png" alt="Griff Tech Card" class="brand-card" />

      <!-- <p class="login-subtitle">Please enter your details</p> -->
      <h2 class="login-title">Welcome Back</h2>

      <form class="login-form">

        <input
          type="email"
          name="email"
          placeholder="Enter email address"
          required
        />

        <input
          type="password"
          name="password"
          placeholder="Enter your password"
          required
        />

        <p class="forgot-password">Forgot password?</p>

        <button type="submit" class="login-btn">Login</button>

      </form>

      <div class="google-input">
        <img
          src="https://developers.google.com/identity/images/g-logo.png"
          alt="Google logo"
        />
        <input type="text" value="Sign in with Google" readonly />
      </div>

      <p class="signup-text">
        Don’t have an account?
        <span class="signup-link">Sign up</span>
      </p>

    </div>

  </section>

</body>
</html>
